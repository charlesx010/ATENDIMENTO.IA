[build]
  command = "npm test && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/public-config"
  to = "/.netlify/functions/public-config"
  status = 200

[[redirects]]
  from = "/api/preferences"
  to = "/.netlify/functions/preferences"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/change-password"
  to = "/.netlify/functions/change-password"
  status = 200

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

[[redirects]]
  from = "/api/free-transcription"
  to = "/.netlify/functions/free-transcription"
  status = 200

[[redirects]]
  from = "/api/free-clinical-ai"
  to = "/.netlify/functions/free-clinical"
  status = 200

[[redirects]]
  from = "/api/free-clinical"
  to = "/.netlify/functions/free-clinical"
  status = 200

[[redirects]]
  from = "/api/ai-evolution"
  to = "/.netlify/functions/ai-evolution"
  status = 200

[[redirects]]
  from = "/api/personal-templates"
  to = "/.netlify/functions/personal-templates"
  status = 200

[[redirects]]
  from = "/api/account-usage"
  to = "/.netlify/functions/account-usage"
  status = 200

[[redirects]]
  from = "/api/organize-note"
  to = "/.netlify/functions/organize-note"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
